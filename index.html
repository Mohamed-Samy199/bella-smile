<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ── Primary Meta ─────────────────────────────────────── -->
  <title>Bella Smile</title>
  <meta name="description"
        content="Bella Smile is a professional dental clinic management system for aligner treatments. Streamline patient workflows, payments, and care plans." />
  <meta name="keywords"
        content="dental aligners, dental clinic management, orthodontics, smile, teeth aligners" />
  <meta name="author" content="Bella Smile" />
  <meta name="robots" content="index, follow" />

  <!-- ── Canonical ────────────────────────────────────────── -->
  <link rel="canonical" href="https://www.bellasmile.com" />

  <!-- ── Open Graph (Facebook, LinkedIn, WhatsApp) ─────────── -->
  <meta property="og:type"        content="website" />
  <meta property="og:url"         content="https://www.bellasmile.com" />
  <meta property="og:title"       content="Bella Smile — Digital Dental Aligner Management" />
  <meta property="og:description" content="Professional dental clinic management system for aligner treatments." />
  <meta property="og:image"       content="https://www.bellasmile.com/og-image.png" />
  <meta property="og:image:width"  content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale"      content="en_US" />
  <meta property="og:site_name"   content="Bella Smile" />

  <!-- ── Twitter Card ─────────────────────────────────────── -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="Bella Smile — Digital Dental Aligner Management" />
  <meta name="twitter:description" content="Professional dental clinic management system for aligner treatments." />
  <meta name="twitter:image"       content="https://www.bellasmile.com/og-image.png" />

  <!-- ── Favicon ──────────────────────────────────────────── -->
   <link rel="icon" type="image/svg+xml" href="/images/favicon.png" />
  <link rel="icon"             type="image/png" sizes="32x32" href="/images/favicon.png" />
  <link rel="icon"             type="image/png" sizes="16x16" href="/images/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180"               href="/images/favicon.png" />
  <link rel="manifest"                                        href="/site.webmanifest" />
  <meta name="theme-color" content="#003366" />

  <!-- ── Performance ──────────────────────────────────────── -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://res.cloudinary.com" />
  <link rel="dns-prefetch" href="https://api.stripe.com" />

</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
